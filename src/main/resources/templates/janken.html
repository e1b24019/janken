<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8">
  <title>Janken</title>
</head>

<body>
  <!-- ログアウトリンク -->
  <a href="/logout">ログアウト</a>

  <h1>Janken GAME!</h1>

  <!-- ログインユーザー名の表示 -->

  <a href="/janken?hand=Choki">ちょき</a>
  <a href="/janken?hand=Pa">ぱー</a>
</body>

</html>
