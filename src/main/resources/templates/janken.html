<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.springframework.org/schema/security">

<head>
  <meta charset="UTF-8">
  <title>Janken</title>
</head>


<body>
  <h1>Janken Game<h1>
      <h2>Hi <span th:text="${login_user}"></span></h2>

      <h2>エントリー</h2>
      <ul>
        <!-- ★ ユーザー名をリンクにし、idをパラメータとして埋め込む -->
        <li th:each="user : ${users}">
          <a th:href="@{/match(id=${user.id})}"> [[${user.name}]]</a>
        </li>
      </ul>

      <!-- ★ 試合結果表示セクションの追加 -->
      <h2>試合結果</h2>
      <div th:each="m : ${matches}">
        id:<span th:text="${m.id}">1</span>
        user1:<span th:text="${m.user1}">2</span>
        user2:<span th:text="${m.user2}">1</span>
        user1の手:<span th:text="${m.user1Hand}">Gu</span>
        user2の手:<span th:text="${m.user2Hand}">Choki</span>
      </div>
</body>

</html>
